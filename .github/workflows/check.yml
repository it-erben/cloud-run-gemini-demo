name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: docker build --tag gemini-demo:check .
      - name: Check container startup
        run: |
          docker run --detach --name gemini-demo --publish 9090:9090 --env PORT=9090 gemini-demo:check
          trap 'docker logs gemini-demo; docker rm --force gemini-demo' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://localhost:9090/healthz
          curl --fail --max-time 5 http://localhost:9090/ | grep -q 'Anmeldung ist noch nicht eingerichtet'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          docker tag gemini-demo:check "$IMAGE:latest"
          docker tag gemini-demo:check "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:latest"
