<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frag Gemini</title>
    {% block extra_head %}{% endblock %}
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 3rem 1rem; background: #f3f5fa; color: #17213b;
             font-family: system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 48rem; margin: auto; padding: 2rem; background: white;
             border: 1px solid #dde2ed; border-radius: 1rem; }
      h1 { margin-top: 0; }
      label { display: block; margin-bottom: .5rem; font-weight: 600; }
      textarea { width: 100%; min-height: 9rem; padding: .8rem; font: inherit;
                 border: 1px solid #8390a9; border-radius: .5rem; resize: vertical; }
      button { margin-top: .8rem; padding: .7rem 1.2rem; border: 0;
               border-radius: .5rem; background: #2455cf; color: white; font: inherit;
               cursor: pointer; }
      a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 3px solid #799fff;
                                                   outline-offset: 3px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
      .error { color: #9f2222; }
      .saved { padding: .8rem; background: #e7f4e9; border-radius: .5rem; }
      code { overflow-wrap: anywhere; }
      a { color: #2455cf; }
      .tabs { display: flex; gap: .5rem; border-bottom: 1px solid #dde2ed;
              margin: 1.5rem 0; padding-bottom: .5rem; }
      .tabs a { padding: .6rem 1rem; border-radius: .5rem; text-decoration: none; }
      .tabs a[aria-current="page"] { color: white; background: #2455cf; }
      .records { border-top: 1px solid #dde2ed; margin-top: 2rem; padding-top: 1rem; }
      .record { border: 1px solid #dde2ed; border-radius: .5rem; padding: 1rem;
                margin: 1rem 0; overflow-wrap: anywhere; }
      .record pre { margin-bottom: 0; }
      .metadata { font-size: .9rem; color: #4d5970; }
      .object-list { padding-left: 1.25rem; }
      .object-list li { margin: 1rem 0; overflow-wrap: anywhere; }
      .pagination { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
      .account { display: flex; align-items: center; justify-content: space-between;
                 gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
      .account button { margin-top: 0; }
      @media (max-width: 480px) { main { padding: 1rem; } body { padding: 1rem .5rem; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Frag Gemini</h1>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
