<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frag Gemini</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 3rem 1rem; background: #f3f5fa; color: #17213b;
             font-family: system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 48rem; margin: auto; padding: 2rem; background: white;
             border: 1px solid #dde2ed; border-radius: 1rem; }
      h1 { margin-top: 0; }
      label { display: block; margin-bottom: .5rem; font-weight: 600; }
      textarea { width: 100%; min-height: 9rem; padding: .8rem; font: inherit;
                 border: 1px solid #8390a9; border-radius: .5rem; resize: vertical; }
      button { margin-top: .8rem; padding: .7rem 1.2rem; border: 0;
               border-radius: .5rem; background: #2455cf; color: white; font: inherit;
               cursor: pointer; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid #799fff;
                                                   outline-offset: 3px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
      .error { color: #9f2222; }
    </style>
  </head>
  <body>
    <main>
      <h1>Frag Gemini</h1>
      <p>Stell eine Frage. Jede Anfrage beginnt ohne bisherigen Chatverlauf.</p>
      <form method="post" action="/">
        <label for="prompt">Deine Frage</label>
        <textarea id="prompt" name="prompt" maxlength="2000" required>{{ prompt }}</textarea>
        <button type="submit">Antwort anfordern</button>
      </form>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      {% if answer %}
      <section aria-labelledby="answer-title">
        <h2 id="answer-title">Antwort</h2>
        <pre>{{ answer }}</pre>
      </section>
      {% endif %}
    </main>
  </body>
</html>
